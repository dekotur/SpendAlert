name: Bug report
description: Report reproducible broken behavior without sharing private data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SpendAlert.

        **Never attach real tokens, chat IDs, `.env`, databases, logs, backups, calendar invitations, screenshots with user data, or machine-specific paths.** Reproduce the issue with a test bot and synthetic records.

  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Python virtual environment
        - Docker Compose
        - Other self-hosted setup
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or a short commit hash
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction with synthetic data
      description: List the exact commands and safe test values needed to reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, private data, local paths, hostnames and public IP addresses from this report.
          required: true
