version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # python-telegram-bot 20.8 requires httpx~=0.26.0. Upgrade them together.
      - dependency-name: httpx
        versions:
          - ">=0.27.0"
      - dependency-name: python-telegram-bot
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Runtime support is intentionally aligned with the tested 3.10–3.12 range.
      - dependency-name: python
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
